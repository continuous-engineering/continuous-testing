version: "1"
name: Self — Environments and Secrets
description: >
  Full lifecycle for environments and secrets: create project → create environment
  with variables → create secret → verify secret value is never exposed → update
  both → delete both → delete project.

  Branching DAG: environment branch and secret branch run in parallel after
  project creation, then converge for cleanup.

  Security assertion: GET /secrets must not expose the encrypted_value field —
  only name, id, and metadata are returned.

  Environment variables required:
    {{env.APP_URL}}     — the app's own URL
    {{env.CT_TEST_KEY}} — value of CT_TEST_API_KEY
runs_on:
  - hosted
tags:
  - crud
  - environments
  - secrets
  - security
  - self-test

steps:
  - name: "Create project"
    type: api
    on_failure: stop
    timeout_ms: 8000
    outputs:
      project_id: "$.id"
    config:
      method: POST
      url: "{{env.APP_URL}}/api/projects"
      headers:
        Content-Type: application/json
        x-ct-test-key: "{{env.CT_TEST_KEY}}"
      body:
        name: "CT Self-Test — Environments & Secrets"
        slug: "ct-self-test-envs"
        description: "Created by self-test pipeline — safe to delete"
      assertions:
        - type: status
          operator: eq
          expected: 201
        - type: jsonpath
          target: "$.id"
          operator: ne
          expected: ""

  # ── Environment branch ────────────────────────────────────────────────────

  - name: "Create environment"
    type: api
    on_failure: stop
    timeout_ms: 8000
    prerequisites:
      - "Create project"
    outputs:
      env_id: "$.id"
    config:
      method: POST
      url: "{{env.APP_URL}}/api/projects/{{ctx.project_id}}/environments"
      headers:
        Content-Type: application/json
        x-ct-test-key: "{{env.CT_TEST_KEY}}"
      body:
        name: "self-test-env"
        is_default: false
        variables:
          BASE_URL: "https://example.com"
          AGENT_PATH: "api/agent"
          TIMEOUT_MS: "5000"
      assertions:
        - type: status
          operator: eq
          expected: 201
        - type: jsonpath
          target: "$.id"
          operator: ne
          expected: ""
        - type: jsonpath
          target: "$.name"
          operator: eq
          expected: "self-test-env"

  - name: "GET environments list"
    type: api
    on_failure: continue
    timeout_ms: 8000
    prerequisites:
      - "Create environment"
    config:
      method: GET
      url: "{{env.APP_URL}}/api/projects/{{ctx.project_id}}/environments"
      headers:
        x-ct-test-key: "{{env.CT_TEST_KEY}}"
      assertions:
        - type: status
          operator: eq
          expected: 200

  - name: "PATCH environment variables"
    type: api
    on_failure: continue
    timeout_ms: 8000
    prerequisites:
      - "GET environments list"
    config:
      method: PATCH
      url: "{{env.APP_URL}}/api/projects/{{ctx.project_id}}/environments/{{ctx.env_id}}"
      headers:
        Content-Type: application/json
        x-ct-test-key: "{{env.CT_TEST_KEY}}"
      body:
        variables:
          BASE_URL: "https://staging.example.com"
          AGENT_PATH: "api/agent"
          TIMEOUT_MS: "8000"
          NEW_VAR: "added-by-patch"
      assertions:
        - type: status
          operator: eq
          expected: 200

  # ── Secrets branch ────────────────────────────────────────────────────────

  - name: "Create secret"
    type: api
    on_failure: stop
    timeout_ms: 8000
    prerequisites:
      - "Create project"
    outputs:
      secret_id: "$.id"
    config:
      method: POST
      url: "{{env.APP_URL}}/api/projects/{{ctx.project_id}}/secrets"
      headers:
        Content-Type: application/json
        x-ct-test-key: "{{env.CT_TEST_KEY}}"
      body:
        name: "SELF_TEST_SECRET"
        value: "super-secret-value-ct-self-test"
      assertions:
        - type: status
          operator: eq
          expected: 201
        - type: jsonpath
          target: "$.id"
          operator: ne
          expected: ""
        - type: jsonpath
          target: "$.name"
          operator: eq
          expected: "SELF_TEST_SECRET"

  - name: "GET secrets list — value must not be exposed"
    type: api
    on_failure: continue
    timeout_ms: 8000
    prerequisites:
      - "Create secret"
    config:
      method: GET
      url: "{{env.APP_URL}}/api/projects/{{ctx.project_id}}/secrets"
      headers:
        x-ct-test-key: "{{env.CT_TEST_KEY}}"
      assertions:
        - type: status
          operator: eq
          expected: 200
        - type: jsonpath
          target: "$.encrypted_value"
          operator: eq
          expected: ""

  - name: "PATCH secret value"
    type: api
    on_failure: continue
    timeout_ms: 8000
    prerequisites:
      - "GET secrets list — value must not be exposed"
    config:
      method: PATCH
      url: "{{env.APP_URL}}/api/projects/{{ctx.project_id}}/secrets/{{ctx.secret_id}}"
      headers:
        Content-Type: application/json
        x-ct-test-key: "{{env.CT_TEST_KEY}}"
      body:
        value: "rotated-secret-value-ct-self-test"
      assertions:
        - type: status
          operator: eq
          expected: 200

  # ── Cleanup — converge both branches ─────────────────────────────────────

  - name: "DELETE secret"
    type: api
    on_failure: continue
    timeout_ms: 8000
    prerequisites:
      - "PATCH secret value"
    config:
      method: DELETE
      url: "{{env.APP_URL}}/api/projects/{{ctx.project_id}}/secrets/{{ctx.secret_id}}"
      headers:
        x-ct-test-key: "{{env.CT_TEST_KEY}}"
      assertions:
        - type: status
          operator: lt
          expected: 300

  - name: "DELETE environment"
    type: api
    on_failure: continue
    timeout_ms: 8000
    prerequisites:
      - "PATCH environment variables"
    config:
      method: DELETE
      url: "{{env.APP_URL}}/api/projects/{{ctx.project_id}}/environments/{{ctx.env_id}}"
      headers:
        x-ct-test-key: "{{env.CT_TEST_KEY}}"
      assertions:
        - type: status
          operator: lt
          expected: 300

  - name: "DELETE project"
    type: api
    on_failure: continue
    timeout_ms: 8000
    prerequisites:
      - "DELETE secret"
      - "DELETE environment"
    config:
      method: DELETE
      url: "{{env.APP_URL}}/api/projects/{{ctx.project_id}}"
      headers:
        x-ct-test-key: "{{env.CT_TEST_KEY}}"
      assertions:
        - type: status
          operator: lt
          expected: 300
