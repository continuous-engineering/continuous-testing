version: "3.9"

# continuous.testing — Full local stack
#
# Network topology:
#   External: localhost:8080 → caddy → web:3000
#   Internal (ct-network):
#     postgres ← web ← caddy ← [runner-1, runner-2, runner-3]
#
# Runners call http://caddy for all API communication.
# Only caddy port 8080 is exposed to the host.
# ADR-001: 3 runner containers — concurrent, independent, stateless.

networks:
  ct-network:
    name: ct-network
    driver: bridge

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [ct-network]
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-continuous_testing}
      POSTGRES_USER:     ${POSTGRES_USER:-ct}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ct} -d ${POSTGRES_DB:-continuous_testing}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # ── Web app (Next.js) ───────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:8080}
    restart: unless-stopped
    networks: [ct-network]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL:                    ${DATABASE_URL}
      ANTHROPIC_API_KEY:               ${ANTHROPIC_API_KEY}
      SECRETS_MASTER_KEY:              ${SECRETS_MASTER_KEY}
      NEXT_PUBLIC_APP_URL:             ${NEXT_PUBLIC_APP_URL:-http://localhost:8080}
      CT_TEST_API_KEY:                 ${CT_TEST_API_KEY:-ct-test-api-key-local-dev-only}
      AUTH_SECRET:                     ${AUTH_SECRET:-dev-only-change-me-in-production-min-32-chars!}
      NODE_ENV:                        production
    volumes:
      # Mount SQL queries as a volume — changes take effect on container restart, no rebuild needed
      - ./web/lib/queries:/app/lib/queries:ro
      # Mount migrations for reference (not auto-run)
      - ./web/migrations:/app/migrations:ro
    # NOT exposed — only reachable via caddy inside ct-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/',r=>r.statusCode<500?process.exit(0):process.exit(1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Caddy reverse proxy (ONLY exposed service) ──────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    networks: [ct-network]
    depends_on:
      web:
        condition: service_started   # don't wait for healthy — web health check uses node HTTP
    ports:
      - "8080:80"   # host:8080 → caddy:80 → web:3000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Runner 1 ─────────────────────────────────────────────────────────────────
  # ADR-001: stateless, polls queue, one DAG per container per job
  runner-1:
    build:
      context: ./runner
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [ct-network]
    depends_on:
      caddy:
        condition: service_started
    environment:
      CT_API_BASE:       http://caddy
      RUNNER_TOKEN:      ${RUNNER_TOKEN_1}
      RUNNER_SCOPE:      hosted
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      POLL_INTERVAL_MS:  3000
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Runner 2 ─────────────────────────────────────────────────────────────────
  runner-2:
    build:
      context: ./runner
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [ct-network]
    depends_on:
      caddy:
        condition: service_started
    environment:
      CT_API_BASE:       http://caddy
      RUNNER_TOKEN:      ${RUNNER_TOKEN_2}
      RUNNER_SCOPE:      hosted
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      POLL_INTERVAL_MS:  3000
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Runner 3 ─────────────────────────────────────────────────────────────────
  runner-3:
    build:
      context: ./runner
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [ct-network]
    depends_on:
      caddy:
        condition: service_started
    environment:
      CT_API_BASE:       http://caddy
      RUNNER_TOKEN:      ${RUNNER_TOKEN_3}
      RUNNER_SCOPE:      hosted
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      POLL_INTERVAL_MS:  3000
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
